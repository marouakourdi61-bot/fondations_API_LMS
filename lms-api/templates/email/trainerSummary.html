<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Résumé formateur</title>
</head>
<body>

    <p>Voici le résumé de vos cours.</p>

    <p>Nombre de cours : {{courseCount}}</p>

    <h2>Statistiques des inscriptions</h2>

    <p>Bonne continuation !</p>
</body>
</html>
